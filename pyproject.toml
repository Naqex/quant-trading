[project]
name = "quant-lab"
version = "0.1.0"
description = "A small, transparent crypto quant research lab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[project.scripts]
quant-lab = "quant_lab.cli:main"
quant-research = "quant_lab.research:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_lab", "src/quant_trading"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
