[project]
name = "quant-lab"
version = "0.1.0"
description = "A small, transparent crypto quant research lab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
quant-lab = "quant_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
