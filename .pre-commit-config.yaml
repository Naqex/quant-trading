# Standalone-first local pre-commit hooks for Naqex Quant Lab.
# Uses uv-managed tools pinned in uv.lock to match .github/workflows/checks.yml.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: pytest-offline
        name: pytest (offline suite)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
